
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piped API 詳細診断</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    input {
      padding: 8px;
      width: 240px;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eee;
      padding: 15px;
      border-radius: 8px;
    }

    .success { color: green; }
    .error { color: #c00; }

    .box {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h2>Piped API 詳細診断</h2>

  <input id="videoId" value="anMTezsEEvY">
  <button onclick="getVideo()">取得</button>

  <div class="box">
    <h3>診断結果</h3>
    <p id="status">待機中</p>
    <p id="reason">まだ通信していません。</p>
  </div>

  <div class="box">
    <h3>通信情報</h3>
    <pre id="info">---</pre>
  </div>

  <div class="box">
    <h3>返却されたJSON</h3>
    <pre id="result">---</pre>
  </div>

  <script>
    async function getVideo() {
      const id = document.getElementById("videoId").value.trim();
      const status = document.getElementById("status");
      const reason = document.getElementById("reason");
      const info = document.getElementById("info");
      const result = document.getElementById("result");

      if (!id) {
        status.textContent = "入力エラー";
        reason.textContent = "動画IDを入力してください。";
        return;
      }

      const api = "https://pipedapi.kavin.rocks";
      const url = `${api}/streams/${encodeURIComponent(id)}`;

      status.className = "";
      status.textContent = "通信中...";
      reason.textContent = "APIサーバーに接続しています。";
      info.textContent = `URL: ${url}\n開始: ${new Date().toLocaleString()}`;
      result.textContent = "---";

      try {
        const response = await fetch(url);
        const body = await response.text();

        info.textContent +=
          `\nHTTPステータス: ${response.status}` +
          `\n応答ヘッダー Content-Type: ${
            response.headers.get("content-type") || "不明"
          }`;

        let data;

        try {
          data = JSON.parse(body);
        } catch (e) {
          status.className = "error";
          status.textContent = "JSON解析失敗";
          reason.textContent =
            "サーバーから応答はありましたが、JSON形式ではありません。\n" +
            "APIサーバーの停止や、エラーページの返却などが考えられます。\n" +
            "解析エラー: " + e.message;
          result.textContent = body || "(応答本文なし)";
          return;
        }

        result.textContent = JSON.stringify(data, null, 2);

        if (!response.ok) {
          status.className = "error";
          status.textContent = "HTTPエラー";
          
          const messages = {
            400: "リクエストが正しくない可能性があります。",
            401: "認証が必要な可能性があります。",
            403: "アクセスが拒否されました。",
            404: "動画またはAPIのエンドポイントが見つかりません。",
            429: "アクセス回数が制限されています。",
            500: "APIサーバー内部でエラーが発生しました。",
            502: "APIサーバーへの接続先でエラーが発生しました。",
            503: "APIサーバーが一時的に利用できません。",
            504: "APIサーバーへの接続がタイムアウトしました。"
          };

          reason.textContent =
            messages[response.status] ||
            "HTTP通信が成功しませんでした。ステータスを確認してください。";
          return;
        }

        status.className = "success";
        status.textContent = "取得成功";
        reason.textContent = "APIから正常なJSONを取得できました。";

      } catch (e) {
        status.className = "error";
        status.textContent = "通信失敗";

        reason.textContent =
          "fetchによる通信が完了しませんでした。\n" +
          "考えられる原因:\n" +
          "・APIサーバーが停止している\n" +
          "・インターネット接続に問題がある\n" +
          "・ブラウザのCORS制限\n" +
          "・ネットワークや拡張機能による通信ブロック\n\n" +
          "エラー詳細: " + e.message;

        info.textContent +=
          "\n\nエラー発生時刻: " + new Date().toLocaleString();
      }
    }
  </script>

</body>
</html>
