
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piped API テスト</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eee;
      padding: 15px;
      border-radius: 8px;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Piped API テスト</h2>

  <input id="videoId" value="anMTezsEEvY">
  <button onclick="getVideo()">取得</button>

  <p id="status">待機中</p>
  <pre id="result">ここに結果が表示されます。</pre>

  <script>
    async function getVideo() {
      const id = document.getElementById("videoId").value.trim();
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      status.textContent = "取得中...";
      result.textContent = "";

      try {
        const response = await fetch(
          `https://pipedapi.kavin.rocks/streams/${encodeURIComponent(id)}`
        );

        const text = await response.text();

        if (!response.ok) {
          throw new Error(
            `HTTPエラー: ${response.status}\n${text}`
          );
        }

        const data = JSON.parse(text);

        status.textContent = "取得成功";
        result.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        status.textContent = "取得失敗";
        result.textContent = error.message;
      }
    }
  </script>
</body>
</html>
